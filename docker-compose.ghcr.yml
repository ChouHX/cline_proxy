# 拉取预构建镜像运行（本地不构建源码）
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 指定版本（默认 latest）：
#   IMAGE_TAG=sha-df2e52b docker compose -f docker-compose.ghcr.yml up -d
#
# 需要 HTTPS（Caddy 自动证书）：
#   CPASS_DOMAIN=pass.example.com docker compose -f docker-compose.ghcr.yml --profile caddy up -d
#
# 注意：与 docker-compose.yml 共用同一个 container_name，
# 两种方式之间切换前先执行 `docker compose down`。
services:
  cline-pass-console:
    image: ghcr.io/chouhx/cline_proxy:${IMAGE_TAG:-latest}
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      # 强烈建议设置：控制台登录 + 下游代理共用的密钥（留空 = 完全不鉴权）
      # - PROXY_KEY=change-me
      # 也可用环境变量注入上游账号 key，免去进控制台手填
      # - CLINE_PASS_KEY=sk_xxx
      # 额度轮询间隔（分钟，默认 5）
      # - USAGE_POLL_MINUTES=5
    volumes:
      - ./data:/data
    ports:
      # 用 Caddy 反代时建议改成 "127.0.0.1:3123:3123"，避免绕过 HTTPS 直连
      - "0.0.0.0:3123:3123"

  # 可选：自带自动 HTTPS 的反代。仅在 --profile caddy 时启动。
  caddy:
    image: caddy:2-alpine
    container_name: cline-pass-caddy
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - cline-pass-console
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CPASS_DOMAIN=${CPASS_DOMAIN:-}
      - CPASS_TLS_EMAIL=${CPASS_TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
