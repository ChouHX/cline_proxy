# 默认方式：拉取预构建镜像运行（不在本地构建源码）
#   docker compose up -d
#
# 指定版本（默认 latest）：
#   IMAGE_TAG=sha-fbaccc6 docker compose up -d
#
# 需要从源码本地构建时用：
#   docker compose -f docker-compose.build.yml up -d --build
#
# 需要一个性化 HTTPS 反代请在外部自行处理，指向本机 3123 端口即可。
services:
  cline-pass-console:
    image: ghcr.io/chouhx/cline_proxy:${IMAGE_TAG:-latest}
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      # 强烈建议设置：控制台登录 + 下游代理共用的密钥（留空 = 完全不鉴权）
      # - PROXY_KEY=change-me
      # 也可用环境变量注入上游账号 key，免去进控制台手填
      # - CLINE_PASS_KEY=sk_xxx
      # 额度轮询间隔（分钟，默认 5）
      # - USAGE_POLL_MINUTES=5
    volumes:
      - ./data:/data
    ports:
      # 若前面挂了 HTTPS 反代，建议改成 "127.0.0.1:3123:3123"
      - "0.0.0.0:3123:3123"
