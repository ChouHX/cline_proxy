# 本地构建运行：改完源码后 `docker compose up -d --build` 即可
#
# 改用预构建镜像（不在本地构建源码）：
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 需要 HTTPS（Caddy 自动证书）：
#   CPASS_DOMAIN=pass.example.com docker compose --profile caddy up -d --build   # 域名
#   docker compose --profile caddy up -d --build                                  # 仅 IP，自签证书
services:
  cline-pass-console:
    build: .
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      # 强烈建议设置：控制台登录 + 下游代理共用的密钥（留空 = 完全不鉴权）
      # - PROXY_KEY=change-me
      # 也可用环境变量注入上游账号 key，免去进控制台手填
      # - CLINE_PASS_KEY=sk_xxx
      # 额度轮询间隔（分钟，默认 5）
      # - USAGE_POLL_MINUTES=5
    volumes:
      - ./data:/data
    ports:
      # 用 Caddy 反代时建议改成 "127.0.0.1:3123:3123"，避免绕过 HTTPS 直连
      - "0.0.0.0:3123:3123"

  # 可选：自带自动 HTTPS 的反代。仅在 --profile caddy 时启动。
  # CPASS_DOMAIN 留空 → 自签证书，访问 https://服务器IP
  # CPASS_DOMAIN 设域名 → 自动申请 Let's Encrypt 受信证书
  caddy:
    image: caddy:2-alpine
    container_name: cline-pass-caddy
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - cline-pass-console
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CPASS_DOMAIN=${CPASS_DOMAIN:-}
      - CPASS_TLS_EMAIL=${CPASS_TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
