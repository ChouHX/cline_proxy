# 从源码本地构建并运行：改完代码后
#   docker compose -f docker-compose.build.yml up -d --build
#
# 默认方式（拉取预构建镜像）：
#   docker compose up -d
#
# 注意：两者共用同一个 container_name，互相切换前先用对应文件执行
#   docker compose [-f docker-compose.build.yml] down
services:
  cline-pass-console:
    build: .
    container_name: cline-pass-console
    restart: unless-stopped
    environment:
      - DATA_DIR=/data
      - BIND_HOST=0.0.0.0
      # 强烈建议设置：控制台登录 + 下游代理共用的密钥（留空 = 完全不鉴权）
      # - PROXY_KEY=change-me
      # 也可用环境变量注入上游账号 key，免去进控制台手填
      # - CLINE_PASS_KEY=sk_xxx
      # 额度轮询间隔（分钟，默认 5）
      # - USAGE_POLL_MINUTES=5
    volumes:
      - ./data:/data
    ports:
      # 若前面挂了 HTTPS 反代，建议改成 "127.0.0.1:3123:3123"
      - "0.0.0.0:3123:3123"
